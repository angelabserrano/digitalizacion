<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" role="img" aria-labelledby="t d">
  <title id="t">Tecnolog&#237;as digitales habilitadoras m&#225;s importantes</title>
  <desc id="d">Siete tecnolog&#237;as estudiadas en esta unidad -Internet de las Cosas, Big Data, rob&#243;tica y automatizaci&#243;n, blockchain, realidad extendida, impresi&#243;n 3D y conectividad 5G-, la ciberseguridad como tecnolog&#237;a transversal a todas ellas, y la computaci&#243;n en la nube y la inteligencia artificial, que por su peso se estudian en detalle en las UD3 y UD4.</desc>
  <style>
    .bg{fill:#fbf7f2;}
    text{font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;fill:#26221e;}
    .h{font-weight:700;font-size:18px;}
    .card{fill:#ffffff;stroke:#e8710a;stroke-width:2;}
    .dashedCard{fill:#ffffff;stroke:#e8710a;stroke-width:2;stroke-dasharray:5 4;}
    .banner{fill:#fff3e8;stroke:#e8710a;stroke-width:2;stroke-dasharray:7 5;}
    .bt{font-weight:700;font-size:13.5px;}
    .p{font-size:11.5px;fill:#4a443d;}
    .bh{font-weight:700;font-size:15px;fill:#e8710a;}
    .fb{font-size:12px;font-style:italic;fill:#4a443d;}
    .icon{stroke:#e8710a;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round;}
    .iconFill{fill:#e8710a;stroke:none;}
  </style>
  <rect class="bg" x="0" y="0" width="900" height="560" rx="14"/>
  <text class="h" x="450" y="32" text-anchor="middle">Tecnolog&#237;as digitales habilitadoras m&#225;s importantes</text>

  <!-- Fila 1 -->
  <g>
    <rect class="card" x="24" y="60" width="180" height="120" rx="12"/>
    <g transform="translate(38,74)">
      <circle class="icon" cx="6" cy="6" r="3"/><circle class="icon" cx="22" cy="6" r="3"/><circle class="icon" cx="14" cy="22" r="3"/>
      <line class="icon" x1="6" y1="6" x2="14" y2="22"/><line class="icon" x1="22" y1="6" x2="14" y2="22"/><line class="icon" x1="6" y1="6" x2="22" y2="6"/>
    </g>
    <text class="bt" x="40" y="128">Internet de las</text>
    <text class="bt" x="40" y="146">Cosas (IoT)</text>
    <text class="p" x="40" y="166">Sensores conectados</text>
  </g>
  <g>
    <rect class="card" x="248" y="60" width="180" height="120" rx="12"/>
    <g transform="translate(262,74)">
      <ellipse class="icon" cx="14" cy="6" rx="10" ry="3.5"/>
      <line class="icon" x1="4" y1="6" x2="4" y2="20"/><line class="icon" x1="24" y1="6" x2="24" y2="20"/>
      <ellipse class="icon" cx="14" cy="13" rx="10" ry="3.5"/>
      <ellipse class="icon" cx="14" cy="20" rx="10" ry="3.5"/>
    </g>
    <text class="bt" x="264" y="128">Big Data</text>
    <text class="p" x="264" y="150">Grandes vol&#250;menes</text>
    <text class="p" x="264" y="166">de datos</text>
  </g>
  <g>
    <rect class="card" x="472" y="60" width="180" height="120" rx="12"/>
    <g transform="translate(486,74)">
      <circle class="icon" cx="14" cy="14" r="10" stroke-dasharray="4 3.2"/>
      <circle class="iconFill" cx="14" cy="14" r="3"/>
    </g>
    <text class="bt" x="488" y="128">Rob&#243;tica y</text>
    <text class="bt" x="488" y="146">automatizaci&#243;n</text>
    <text class="p" x="488" y="166">Tareas repetitivas</text>
  </g>
  <g>
    <rect class="card" x="696" y="60" width="180" height="120" rx="12"/>
    <g transform="translate(710,74)">
      <rect class="icon" x="1" y="9" width="10" height="10" rx="3"/>
      <rect class="icon" x="9" y="9" width="10" height="10" rx="3"/>
      <rect class="icon" x="17" y="9" width="10" height="10" rx="3"/>
    </g>
    <text class="bt" x="712" y="128">Blockchain</text>
    <text class="p" x="712" y="150">Registro</text>
    <text class="p" x="712" y="166">descentralizado</text>
  </g>

  <!-- Fila 2 -->
  <g>
    <rect class="card" x="136" y="204" width="180" height="120" rx="12"/>
    <g transform="translate(150,218)">
      <path class="icon" d="M4 9 Q14 -2 24 9"/>
      <rect class="icon" x="1" y="9" width="26" height="11" rx="5"/>
      <circle class="iconFill" cx="8" cy="14.5" r="3"/><circle class="iconFill" cx="20" cy="14.5" r="3"/>
    </g>
    <text class="bt" x="152" y="272">Realidad</text>
    <text class="bt" x="152" y="290">extendida (XR)</text>
    <text class="p" x="152" y="310">Entornos virtuales</text>
  </g>
  <g>
    <rect class="card" x="360" y="204" width="180" height="120" rx="12"/>
    <g transform="translate(374,218)">
      <rect class="iconFill" x="1" y="20" width="26" height="5" rx="1.5" opacity="0.45"/>
      <rect class="iconFill" x="1" y="12" width="26" height="5" rx="1.5" opacity="0.7"/>
      <rect class="iconFill" x="1" y="4" width="26" height="5" rx="1.5"/>
    </g>
    <text class="bt" x="376" y="272">Impresi&#243;n 3D</text>
    <text class="p" x="376" y="294">Fabricaci&#243;n aditiva</text>
    <text class="p" x="376" y="310">por capas</text>
  </g>
  <g>
    <rect class="card" x="584" y="204" width="180" height="120" rx="12"/>
    <g transform="translate(598,218)">
      <rect class="iconFill" x="1" y="18" width="4" height="8"/>
      <rect class="iconFill" x="8" y="13" width="4" height="13"/>
      <rect class="iconFill" x="15" y="8" width="4" height="18"/>
      <rect class="iconFill" x="22" y="3" width="4" height="23"/>
    </g>
    <text class="bt" x="600" y="272">Conectividad</text>
    <text class="bt" x="600" y="290">avanzada (5G)</text>
    <text class="p" x="600" y="310">Baja latencia</text>
  </g>

  <!-- Ciberseguridad: tecnolog&#237;a transversal -->
  <g>
    <rect class="banner" x="24" y="348" width="852" height="76" rx="14"/>
    <g transform="translate(50,368)">
      <polygon class="icon" points="18,2 32,8 32,20 18,34 4,20 4,8"/>
      <polyline class="icon" points="11,18 16,23 25,12"/>
    </g>
    <text class="bh" x="104" y="382">Ciberseguridad</text>
    <text class="p" x="104" y="401">Tecnolog&#237;a transversal: protege dispositivos, datos y comunicaciones en todas las dem&#225;s tecnolog&#237;as.</text>
  </g>

  <!-- Nube e IA: se estudian aparte -->
  <g>
    <rect class="dashedCard" x="24" y="448" width="414" height="76" rx="12"/>
    <g transform="translate(46,468)">
      <circle class="iconFill" cx="9" cy="15" r="6"/><circle class="iconFill" cx="17" cy="10" r="8"/><circle class="iconFill" cx="25" cy="15" r="5"/>
      <rect class="iconFill" x="6" y="15" width="22" height="8" rx="4"/>
    </g>
    <text class="bt" x="94" y="480">Computaci&#243;n en la nube</text>
    <text class="p" x="94" y="500">Infraestructura &#8594; ver UD3</text>
  </g>
  <g>
    <rect class="dashedCard" x="462" y="448" width="414" height="76" rx="12"/>
    <g transform="translate(484,468)">
      <circle class="iconFill" cx="14" cy="14" r="3"/>
      <circle class="iconFill" cx="14" cy="3" r="2.2"/><circle class="iconFill" cx="25" cy="20" r="2.2"/><circle class="iconFill" cx="3" cy="20" r="2.2"/>
      <line class="icon" x1="14" y1="14" x2="14" y2="3"/><line class="icon" x1="14" y1="14" x2="25" y2="20"/><line class="icon" x1="14" y1="14" x2="3" y2="20"/>
    </g>
    <text class="bt" x="532" y="480">Inteligencia artificial</text>
    <text class="p" x="532" y="500">Aprendizaje autom&#225;tico &#8594; UD4</text>
  </g>

  <text class="fb" x="450" y="546" text-anchor="middle">La ciberseguridad, la nube y la IA dan soporte y peso propio al resto de tecnolog&#237;as habilitadoras</text>
</svg>
