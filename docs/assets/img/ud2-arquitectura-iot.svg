<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" role="img" aria-labelledby="t d">
  <title id="t">Arquitectura b&#225;sica de un sistema IoT</title>
  <desc id="d">Los dispositivos y sensores de campo env&#237;an sus datos a una pasarela IoT (gateway) que los preprocesa; la pasarela los sube a una plataforma o nube y, a la vez, puede mostrarlos en un panel local. Desde la nube, la informaci&#243;n llega tambi&#233;n a una aplicaci&#243;n o panel remoto.</desc>
  <style>
    .bg{fill:#fbf7f2;}
    .card{fill:#ffffff;stroke:#e8710a;stroke-width:2;}
    .cardAlt{fill:#ffffff;stroke:#1a73e8;stroke-width:2;stroke-dasharray:5 4;}
    .num{fill:#e8710a;}
    .numAlt{fill:#1a73e8;}
    text{font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;fill:#26221e;}
    .h{font-weight:700;font-size:17px;}
    .bt{font-weight:700;font-size:14px;}
    .p{font-size:11px;fill:#4a443d;}
    .nt{font-weight:700;font-size:13px;fill:#ffffff;}
    .arrow{stroke:#e8710a;stroke-width:2.5;fill:none;marker-end:url(#a);}
    .arrowAlt{stroke:#1a73e8;stroke-width:2.5;fill:none;marker-end:url(#b);stroke-dasharray:5 4;}
    .icon{stroke:#e8710a;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round;}
    .iconFill{fill:#e8710a;stroke:none;}
    .iconAlt{stroke:#1a73e8;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round;}
    .iconFillAlt{fill:#1a73e8;stroke:none;}
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#e8710a"/>
    </marker>
    <marker id="b" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#1a73e8"/>
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="900" height="560" rx="14"/>
  <text class="h" x="450" y="34" text-anchor="middle">Arquitectura b&#225;sica de un sistema IoT</text>

  <!-- Capa 3: Plataforma / nube -->
  <g>
    <rect class="card" x="190" y="60" width="260" height="110" rx="12"/>
    <circle class="num" cx="218" cy="86" r="13"/><text class="nt" x="218" y="91" text-anchor="middle">3</text>
    <g transform="translate(236,122)">
      <circle class="iconFill" cx="9" cy="10" r="6"/><circle class="iconFill" cx="17" cy="5" r="8"/><circle class="iconFill" cx="25" cy="10" r="5"/>
      <rect class="iconFill" x="6" y="10" width="22" height="8" rx="4"/>
    </g>
    <text class="bt" x="272" y="118">Plataforma / nube</text>
    <text class="p" x="272" y="150">Almacena y procesa</text>
  </g>

  <!-- Capa 2: Pasarela IoT (gateway) -->
  <g>
    <rect class="card" x="190" y="220" width="260" height="110" rx="12"/>
    <circle class="num" cx="218" cy="246" r="13"/><text class="nt" x="218" y="251" text-anchor="middle">2</text>
    <g transform="translate(236,278)">
      <rect class="icon" x="1" y="1" width="26" height="18" rx="3"/>
      <circle class="iconFill" cx="8" cy="10" r="2"/><circle class="iconFill" cx="14" cy="10" r="2"/><circle class="iconFill" cx="20" cy="10" r="2"/>
    </g>
    <text class="bt" x="272" y="278">Conectividad:</text>
    <text class="bt" x="272" y="296">pasarela IoT (gateway)</text>
    <text class="p" x="272" y="316">Wi-Fi, 4G/5G, LoRaWAN...</text>
  </g>

  <!-- Capa 1: Dispositivos y sensores -->
  <g>
    <rect class="card" x="190" y="380" width="260" height="110" rx="12"/>
    <circle class="num" cx="218" cy="406" r="13"/><text class="nt" x="218" y="411" text-anchor="middle">1</text>
    <g transform="translate(236,436)">
      <circle class="icon" cx="6" cy="6" r="3"/><circle class="icon" cx="22" cy="6" r="3"/><circle class="icon" cx="14" cy="22" r="3"/>
      <line class="icon" x1="6" y1="6" x2="14" y2="22"/><line class="icon" x1="22" y1="6" x2="14" y2="22"/><line class="icon" x1="6" y1="6" x2="22" y2="6"/>
    </g>
    <text class="bt" x="272" y="438">Dispositivos y sensores</text>
    <text class="p" x="272" y="470">Sensores, PLC y maquinaria</text>
  </g>

  <!-- Capa 4: Aplicaci&#243;n remota (junto a la nube) -->
  <g>
    <rect class="cardAlt" x="550" y="60" width="260" height="110" rx="12"/>
    <circle class="numAlt" cx="578" cy="86" r="13"/><text class="nt" x="578" y="91" text-anchor="middle">4</text>
    <g transform="translate(596,122)">
      <rect class="iconAlt" x="1" y="1" width="26" height="18" rx="2"/>
      <rect class="iconFillAlt" x="1" y="12" width="4" height="6"/>
      <rect class="iconFillAlt" x="8" y="8" width="4" height="10"/>
      <rect class="iconFillAlt" x="15" y="4" width="4" height="14"/>
    </g>
    <text class="bt" x="632" y="118">Aplicaci&#243;n remota</text>
    <text class="p" x="632" y="140">Panel o <tspan font-style="italic">dashboard</tspan></text>
    <text class="p" x="632" y="154">en la nube</text>
  </g>

  <!-- Capa 4: Aplicaci&#243;n local (junto a la pasarela) -->
  <g>
    <rect class="cardAlt" x="550" y="220" width="260" height="110" rx="12"/>
    <circle class="numAlt" cx="578" cy="246" r="13"/><text class="nt" x="578" y="251" text-anchor="middle">4</text>
    <g transform="translate(596,278)">
      <rect class="iconAlt" x="1" y="1" width="26" height="18" rx="2"/>
      <line class="iconAlt" x1="14" y1="19" x2="14" y2="23"/>
      <line class="iconAlt" x1="8" y1="23" x2="20" y2="23"/>
    </g>
    <text class="bt" x="632" y="278">Aplicaci&#243;n local</text>
    <text class="p" x="632" y="300">Panel de control</text>
    <text class="p" x="632" y="314">junto a la pasarela</text>
  </g>

  <!-- Flujo principal: dispositivos -> pasarela -> nube -->
  <line class="arrow" x1="320" y1="380" x2="320" y2="334"/>
  <line class="arrow" x1="320" y1="220" x2="320" y2="174"/>

  <!-- Ramas hacia las aplicaciones -->
  <line class="arrow" x1="450" y1="115" x2="546" y2="115"/>
  <line class="arrowAlt" x1="450" y1="275" x2="546" y2="275"/>

  <text class="p" x="450" y="530" text-anchor="middle" style="font-style:italic;">El dato fluye de los dispositivos a la pasarela y de ah&#237; a la nube; la aplicaci&#243;n puede verse en local (junto a la pasarela) o en remoto (desde la nube)</text>
</svg>
