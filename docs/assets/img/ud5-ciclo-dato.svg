<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 560" role="img" aria-labelledby="t d">
  <title id="t">Ciclo de vida del dato</title>
  <desc id="d">Seis fases encadenadas de forma circular: recogida, almacenamiento, procesamiento, análisis, uso y difusión, y conservación o eliminación.</desc>
  <style>
    .bg{fill:#fbf7f2;}
    text{font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;fill:#26221e;}
    .h{font-weight:700;font-size:16px;}
    .node{fill:#ffffff;stroke:#e8710a;stroke-width:2;}
    .nt{font-weight:700;font-size:13.5px;fill:#26221e;}
    .ct{font-weight:700;font-size:17px;fill:#e8710a;}
    .arc{fill:none;stroke:#e8710a;stroke-width:2.5;marker-end:url(#a);}
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#e8710a"/>
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="720" height="560" rx="14"/>
  <text class="h" x="360" y="32" text-anchor="middle">Ciclo de vida del dato</text>

  <path class="arc" d="M418.7 109.3 A 190 190 0 0 1 487.1 148.8"/>
  <path class="arc" d="M545.8 250.5 A 190 190 0 0 1 545.8 329.5"/>
  <path class="arc" d="M487.1 431.2 A 190 190 0 0 1 418.7 470.7"/>
  <path class="arc" d="M301.3 470.7 A 190 190 0 0 1 232.9 431.2"/>
  <path class="arc" d="M174.2 329.5 A 190 190 0 0 1 174.2 250.5"/>
  <path class="arc" d="M232.9 148.8 A 190 190 0 0 1 301.3 109.3"/>

  <text class="ct" x="360" y="296" text-anchor="middle">El dato como activo</text>

  <g>
    <rect class="node" x="264" y="72" width="192" height="56" rx="14"/>
    <text class="nt" x="360" y="105" text-anchor="middle">1. Recogida</text>
  </g>
  <g>
    <rect class="node" x="428" y="167" width="192" height="56" rx="14"/>
    <text class="nt" x="524" y="200" text-anchor="middle">2. Almacenamiento</text>
  </g>
  <g>
    <rect class="node" x="428" y="357" width="192" height="56" rx="14"/>
    <text class="nt" x="524" y="390" text-anchor="middle">3. Procesamiento</text>
  </g>
  <g>
    <rect class="node" x="264" y="452" width="192" height="56" rx="14"/>
    <text class="nt" x="360" y="485" text-anchor="middle">4. An&#225;lisis</text>
  </g>
  <g>
    <rect class="node" x="100" y="357" width="192" height="56" rx="14"/>
    <text class="nt" x="196" y="390" text-anchor="middle">5. Uso y difusi&#243;n</text>
  </g>
  <g>
    <rect class="node" x="100" y="167" width="192" height="56" rx="14"/>
    <text class="nt" x="196" y="190" text-anchor="middle">6. Conservaci&#243;n</text>
    <text class="nt" x="196" y="208" text-anchor="middle">o eliminaci&#243;n</text>
  </g>
</svg>
