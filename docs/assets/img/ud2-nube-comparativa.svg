<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 280" role="img" aria-labelledby="t d">
  <title id="t">Infraestructura propia frente a la computaci&#243;n en la nube</title>
  <desc id="d">Con infraestructura propia la empresa compra y mantiene sus propios servidores, con una capacidad fija. Con la computaci&#243;n en la nube, el proveedor mantiene la infraestructura, la empresa paga por lo que usa y puede escalar la capacidad seg&#250;n la demanda.</desc>
  <style>
    .bg{fill:#fbf7f2;}
    .card1{fill:#ffffff;stroke:#9a9488;stroke-width:2;}
    .card2{fill:#ffffff;stroke:#1a73e8;stroke-width:2;}
    text{font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;fill:#26221e;}
    .h{font-weight:700;font-size:17px;}
    .bt1{font-weight:700;font-size:14.5px;fill:#5f574d;}
    .bt2{font-weight:700;font-size:14.5px;fill:#1257b0;}
    .p{font-size:11.5px;fill:#4a443d;}
    .icon1{stroke:#9a9488;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round;}
    .icon2{stroke:#1a73e8;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round;}
    .iconFill2{fill:#1a73e8;stroke:none;}
    .vs{font-weight:700;font-size:13px;fill:#ffffff;}
    .vsc{fill:#e8710a;}
  </style>
  <rect class="bg" x="0" y="0" width="880" height="280" rx="14"/>
  <text class="h" x="440" y="30" text-anchor="middle">Infraestructura propia frente a la computaci&#243;n en la nube</text>

  <g>
    <rect class="card1" x="24" y="54" width="390" height="202" rx="12"/>
    <g transform="translate(48,70)">
      <rect class="icon1" x="2" y="2" width="20" height="26" rx="2"/>
      <line class="icon1" x1="6" y1="9" x2="18" y2="9"/><line class="icon1" x1="6" y1="15" x2="18" y2="15"/><line class="icon1" x1="6" y1="21" x2="18" y2="21"/>
    </g>
    <text class="bt1" x="84" y="90">Infraestructura propia</text>
    <text class="p" x="48" y="122">&#8226; Comprar y mantener los servidores</text>
    <text class="p" x="48" y="144">&#8226; Capacidad fija, pensada para el pico</text>
    <text class="p" x="48" y="166">&#8226; Inversi&#243;n inicial alta</text>
    <text class="p" x="48" y="188">&#8226; El mantenimiento es responsabilidad</text>
    <text class="p" x="48" y="206">&#160;&#160;de la propia empresa</text>
    <text class="p" x="48" y="234">Se paga igual aunque se use poco</text>
  </g>

  <circle class="vsc" cx="440" cy="155" r="22"/>
  <text class="vs" x="440" y="160" text-anchor="middle">VS</text>

  <g>
    <rect class="card2" x="466" y="54" width="390" height="202" rx="12"/>
    <g transform="translate(490,70)">
      <circle class="iconFill2" cx="9" cy="15" r="6"/><circle class="iconFill2" cx="17" cy="10" r="8"/><circle class="iconFill2" cx="25" cy="15" r="5"/>
      <rect class="iconFill2" x="6" y="15" width="22" height="8" rx="4"/>
    </g>
    <text class="bt2" x="528" y="90">Computaci&#243;n en la nube</text>
    <text class="p" x="490" y="122">&#8226; El proveedor mantiene la infraestructura</text>
    <text class="p" x="490" y="144">&#8226; Capacidad el&#225;stica: sube y baja</text>
    <text class="p" x="490" y="166">&#8226; Sin inversi&#243;n inicial en servidores</text>
    <text class="p" x="490" y="188">&#8226; Mantenimiento a cargo del</text>
    <text class="p" x="490" y="206">&#160;&#160;proveedor de la nube</text>
    <text class="p" x="490" y="234">Se paga seg&#250;n el uso (<tspan font-style="italic">pay-as-you-go</tspan>)</text>
  </g>
</svg>
