<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" role="img" aria-labelledby="t d">
  <title id="t">El Internet de las Cosas en distintos &#225;mbitos</title>
  <desc id="d">El Internet de las Cosas conecta objetos de seis &#225;mbitos: el hogar, con termostatos y cerraduras inteligentes; la ciudad, con sensores de tr&#225;fico y alumbrado; la industria, con mantenimiento predictivo; la agricultura de precisi&#243;n, con sondas de humedad; la salud, con pulseras que miden constantes vitales; y la log&#237;stica, con trazabilidad de mercanc&#237;as.</desc>
  <style>
    .bg{fill:#fbf7f2;}
    text{font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;fill:#26221e;}
    .h{font-weight:700;font-size:18px;}
    .hub{fill:#e8710a;}
    .hubt{font-weight:700;font-size:16px;fill:#ffffff;}
    .trunk{stroke:#c9c2b6;stroke-width:2.5;fill:none;}
    .bt{font-weight:700;font-size:14px;}
    .p{font-size:11px;fill:#4a443d;}
    .c1{stroke:#e8710a;}
    .c2{stroke:#1a73e8;}
    .c3{stroke:#1e8e3e;}
    .c4{stroke:#0f9d8c;}
    .c5{stroke:#d23669;}
    .c6{stroke:#673ab7;}
    .card{fill:#ffffff;stroke-width:2.5;}
    .f1{fill:#e8710a;} .f2{fill:#1a73e8;} .f3{fill:#1e8e3e;} .f4{fill:#0f9d8c;} .f5{fill:#d23669;} .f6{fill:#673ab7;}
    .t1{fill:#c15600;} .t2{fill:#1257b0;} .t3{fill:#14682e;} .t4{fill:#0b6e62;} .t5{fill:#a01f49;} .t6{fill:#4a2f8f;}
    .icon{stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round;}
  </style>
  <rect class="bg" x="0" y="0" width="900" height="460" rx="14"/>
  <text class="h" x="450" y="28" text-anchor="middle">El Internet de las Cosas en distintos &#225;mbitos</text>

  <!-- Troncal -->
  <line class="trunk" x1="450" y1="110" x2="450" y2="135"/>
  <line class="trunk" x1="160" y1="135" x2="740" y2="135"/>
  <line class="trunk" x1="160" y1="135" x2="160" y2="150"/>
  <line class="trunk" x1="450" y1="135" x2="450" y2="150"/>
  <line class="trunk" x1="740" y1="135" x2="740" y2="150"/>
  <line class="trunk" x1="160" y1="270" x2="160" y2="300"/>
  <line class="trunk" x1="450" y1="270" x2="450" y2="300"/>
  <line class="trunk" x1="740" y1="270" x2="740" y2="300"/>

  <!-- Hub -->
  <circle class="hub" cx="450" cy="70" r="40"/>
  <text class="hubt" x="450" y="76" text-anchor="middle">IoT</text>

  <!-- Hogar -->
  <g>
    <rect class="card c1" x="30" y="150" width="260" height="120" rx="12"/>
    <g transform="translate(52,168)">
      <path class="f1" d="M14 0 L28 11 L24 11 L24 26 L4 26 L4 11 L0 11 Z"/>
    </g>
    <text class="bt t1" x="92" y="186">Hogar</text>
    <text class="p" x="92" y="206"><tspan font-style="italic">Smart home</tspan>: termostatos,</text>
    <text class="p" x="92" y="222">cerraduras, asistentes de voz</text>
  </g>

  <!-- Ciudad -->
  <g>
    <rect class="card c2" x="320" y="150" width="260" height="120" rx="12"/>
    <g transform="translate(342,168)">
      <rect class="f2" x="0" y="10" width="8" height="18"/>
      <rect class="f2" x="10" y="4" width="8" height="24"/>
      <rect class="f2" x="20" y="14" width="8" height="14"/>
    </g>
    <text class="bt t2" x="382" y="186">Ciudad</text>
    <text class="p" x="382" y="206"><tspan font-style="italic">Smart city</tspan>: tr&#225;fico,</text>
    <text class="p" x="382" y="222">alumbrado, residuos</text>
  </g>

  <!-- Industria -->
  <g>
    <rect class="card c3" x="610" y="150" width="260" height="120" rx="12"/>
    <g transform="translate(632,168)">
      <circle class="icon" style="stroke:#1e8e3e;" cx="14" cy="14" r="10" stroke-dasharray="4 3.2"/>
      <circle class="f3" style="stroke:none;" cx="14" cy="14" r="3"/>
    </g>
    <text class="bt t3" x="672" y="186">Industria</text>
    <text class="p" x="672" y="206">IIoT: mantenimiento</text>
    <text class="p" x="672" y="222">predictivo de maquinaria</text>
  </g>

  <!-- Agricultura -->
  <g>
    <rect class="card c4" x="30" y="300" width="260" height="120" rx="12"/>
    <g transform="translate(52,318)">
      <path class="f4" d="M0 26 C0 10 14 0 28 0 C28 16 14 26 0 26 Z"/>
    </g>
    <text class="bt t4" x="92" y="336">Agricultura</text>
    <text class="p" x="92" y="356">Sondas de humedad</text>
    <text class="p" x="92" y="372">y riego de precisi&#243;n</text>
  </g>

  <!-- Salud -->
  <g>
    <rect class="card c5" x="320" y="300" width="260" height="120" rx="12"/>
    <g transform="translate(342,318)">
      <path class="icon" style="stroke:#d23669;" d="M0 8 L7 8 L10 2 L14 18 L17 10 L20 14 L28 14"/>
    </g>
    <text class="bt t5" x="382" y="336">Salud</text>
    <text class="p" x="382" y="356"><tspan font-style="italic">Wearables</tspan> que miden</text>
    <text class="p" x="382" y="372">constantes vitales</text>
  </g>

  <!-- Log&#237;stica -->
  <g>
    <rect class="card c6" x="610" y="300" width="260" height="120" rx="12"/>
    <g transform="translate(632,320)">
      <rect class="icon" style="stroke:#673ab7;" x="0" y="0" width="18" height="12" rx="2"/>
      <path class="icon" style="stroke:#673ab7;" d="M18 4 L25 4 L28 9 L28 12 L18 12"/>
      <circle class="f6" style="stroke:none;" cx="6" cy="14" r="3"/>
      <circle class="f6" style="stroke:none;" cx="22" cy="14" r="3"/>
    </g>
    <text class="bt t6" x="672" y="336">Log&#237;stica</text>
    <text class="p" x="672" y="356">Trazabilidad de mercanc&#237;as</text>
    <text class="p" x="672" y="372">en tr&#225;nsito</text>
  </g>

  <text class="p" x="450" y="446" text-anchor="middle" style="font-style:italic;">Sensores conectados que captan datos del entorno y, a menudo, pueden actuar sobre &#233;l</text>
</svg>
