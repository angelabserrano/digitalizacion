<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 260" role="img" aria-labelledby="t d">
  <title id="t">Arquitectura básica de un sistema IoT</title>
  <desc id="d">Cuatro capas encadenadas: dispositivos y sensores, conectividad, plataforma o nube y aplicación.</desc>
  <style>
    .bg{fill:#fbf7f2;}
    .card{fill:#ffffff;stroke:#e8710a;stroke-width:2;}
    .num{fill:#e8710a;}
    text{font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;fill:#26221e;}
    .h{font-weight:700;font-size:17px;}
    .bt{font-weight:700;font-size:14px;}
    .p{font-size:11.5px;fill:#4a443d;}
    .nt{font-weight:700;font-size:13px;fill:#ffffff;}
    .arrow{stroke:#e8710a;stroke-width:2.5;fill:none;marker-end:url(#a);}
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#e8710a"/>
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="880" height="260" rx="14"/>
  <text class="h" x="440" y="34" text-anchor="middle">Arquitectura b&#225;sica de un sistema IoT</text>

  <g>
    <rect class="card" x="24" y="70" width="180" height="120" rx="12"/>
    <circle class="num" cx="52" cy="98" r="13"/><text class="nt" x="52" y="103" text-anchor="middle">1</text>
    <text class="bt" x="40" y="132">Dispositivos</text>
    <text class="bt" x="40" y="150">y sensores</text>
    <text class="p" x="40" y="172">Captan datos del entorno</text>
  </g>
  <g>
    <rect class="card" x="248" y="70" width="180" height="120" rx="12"/>
    <circle class="num" cx="276" cy="98" r="13"/><text class="nt" x="276" y="103" text-anchor="middle">2</text>
    <text class="bt" x="264" y="132">Conectividad</text>
    <text class="p" x="264" y="156">Wi-Fi, 4G/5G, LoRaWAN,</text>
    <text class="p" x="264" y="172">Zigbee, NB-IoT</text>
  </g>
  <g>
    <rect class="card" x="472" y="70" width="180" height="120" rx="12"/>
    <circle class="num" cx="500" cy="98" r="13"/><text class="nt" x="500" y="103" text-anchor="middle">3</text>
    <text class="bt" x="488" y="132">Plataforma</text>
    <text class="bt" x="488" y="150">/ nube</text>
    <text class="p" x="488" y="172">Almacena y procesa</text>
  </g>
  <g>
    <rect class="card" x="696" y="70" width="180" height="120" rx="12"/>
    <circle class="num" cx="724" cy="98" r="13"/><text class="nt" x="724" y="103" text-anchor="middle">4</text>
    <text class="bt" x="712" y="132">Aplicaci&#243;n</text>
    <text class="p" x="712" y="156">Muestra informaci&#243;n</text>
    <text class="p" x="712" y="172">y dispara acciones</text>
  </g>

  <line class="arrow" x1="206" y1="130" x2="244" y2="130"/>
  <line class="arrow" x1="430" y1="130" x2="468" y2="130"/>
  <line class="arrow" x1="654" y1="130" x2="692" y2="130"/>

  <text class="p" x="440" y="226" text-anchor="middle" style="font-style:italic;">El dato fluye del mundo f&#237;sico hacia la aplicaci&#243;n, que puede devolver una orden a un actuador</text>
</svg>
