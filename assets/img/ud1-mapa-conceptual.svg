<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" role="img" aria-labelledby="t d">
  <title id="t">Mapa conceptual de la Unidad 1: la digitalización</title>
  <desc id="d">La digitalización se organiza en tres ramas: concepto y origen (grados de intensidad, revoluciones industriales, elementos de la Industria 4.0 y sistemas ciberfísicos); empresa y entornos IT/OT (estructura de la empresa, entornos IT y OT, tecnologías de planta y negocio y su convergencia); alcance e implicaciones (sectores productivos, nuevos modelos de negocio, y retos y riesgos).</desc>
  <style>
    .bg{fill:#fbf7f2;}
    text{font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;fill:#26221e;}
    .root{fill:#e8710a;}
    .roott{font-weight:700;font-size:19px;fill:#ffffff;}
    .lbl{font-weight:700;font-size:12.5px;fill:#5f574d;}
    .hd{font-weight:700;font-size:13.5px;}
    .bt{font-weight:700;font-size:13px;}
    .p{font-size:10.5px;fill:#4a443d;}
    .ln1{stroke:#e8710a;stroke-width:2.5;fill:none;marker-end:url(#a1);}
    .ln2{stroke:#1a73e8;stroke-width:2.5;fill:none;marker-end:url(#a2);}
    .ln3{stroke:#1e8e3e;stroke-width:2.5;fill:none;marker-end:url(#a3);}
    .v1{stroke:#e8710a;stroke-width:2.5;}
    .v2{stroke:#1a73e8;stroke-width:2.5;}
    .v3{stroke:#1e8e3e;stroke-width:2.5;}
    .card1{fill:#ffffff;stroke:#e8710a;stroke-width:2;}
    .card2{fill:#ffffff;stroke:#1a73e8;stroke-width:2;}
    .card3{fill:#ffffff;stroke:#1e8e3e;stroke-width:2;}
    .head1{fill:#fbe4d3;stroke:#e8710a;stroke-width:2;}
    .head2{fill:#e1effd;stroke:#1a73e8;stroke-width:2;}
    .head3{fill:#e4f3e8;stroke:#1e8e3e;stroke-width:2;}
    .t1{fill:#c15600;}
    .t2{fill:#1257b0;}
    .t3{fill:#14682e;}
    .ik{fill:#efe7fb;stroke:#673ab7;stroke-width:2;}
    .ikt{font-weight:700;fill:#4a2f8f;}
    .ikp{font-size:11.5px;fill:#3d3550;}
  </style>
  <defs>
    <marker id="a1" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#e8710a"/>
    </marker>
    <marker id="a2" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#1a73e8"/>
    </marker>
    <marker id="a3" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#1e8e3e"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1000" height="700" rx="14"/>

  <!-- Nodo raíz -->
  <rect class="root" x="390" y="20" width="220" height="46" rx="10"/>
  <text class="roott" x="500" y="49" text-anchor="middle">LA DIGITALIZACIÓN</text>

  <!-- Conectores raíz -> cabecera -->
  <path class="ln1" d="M500 66 L175 107"/>
  <path class="ln2" d="M500 66 L500 107"/>
  <path class="ln3" d="M500 66 L825 107"/>

  <!-- Etiquetas de las ramas -->
  <rect x="146" y="80" width="58" height="17" fill="#fbf7f2"/>
  <rect x="451" y="80" width="98" height="17" fill="#fbf7f2"/>
  <rect x="781" y="80" width="88" height="17" fill="#fbf7f2"/>
  <text class="lbl" x="175" y="92" text-anchor="middle">¿Qué es?</text>
  <text class="lbl" x="500" y="92" text-anchor="middle">¿A qué afecta?</text>
  <text class="lbl" x="825" y="92" text-anchor="middle">¿Qué implica?</text>

  <!-- ================= RAMA 1 ================= -->
  <rect class="head1" x="35" y="108" width="280" height="40" rx="10"/>
  <text class="hd t1" x="175" y="133" text-anchor="middle">1. CONCEPTO Y ORIGEN</text>

  <line class="v1" x1="175" y1="148" x2="175" y2="170"/>
  <line class="v1" x1="175" y1="264" x2="175" y2="282"/>
  <line class="v1" x1="175" y1="376" x2="175" y2="394"/>
  <line class="v1" x1="175" y1="488" x2="175" y2="506"/>

  <rect class="card1" x="35" y="170" width="280" height="94" rx="12"/>
  <text class="bt t1" x="175" y="202" text-anchor="middle">Grados de intensidad</text>
  <text class="p" x="175" y="223" text-anchor="middle">digitización → digitalización</text>
  <text class="p" x="175" y="240" text-anchor="middle">→ transformación digital</text>

  <rect class="card1" x="35" y="282" width="280" height="94" rx="12"/>
  <text class="bt t1" x="175" y="314" text-anchor="middle">Revoluciones industriales</text>
  <text class="p" x="175" y="335" text-anchor="middle">de la máquina de vapor</text>
  <text class="p" x="175" y="352" text-anchor="middle">a la Industria 4.0</text>

  <rect class="card1" x="35" y="394" width="280" height="94" rx="12"/>
  <text class="bt t1" x="175" y="426" text-anchor="middle">Elementos de la Industria 4.0</text>
  <text class="p" x="175" y="447" text-anchor="middle">interconexión, datos en tiempo real,</text>
  <text class="p" x="175" y="464" text-anchor="middle">decisiones autónomas, virtualización</text>

  <rect class="card1" x="35" y="506" width="280" height="94" rx="12"/>
  <text class="bt t1" x="175" y="538" text-anchor="middle">Sistemas ciberfísicos</text>
  <text class="p" x="175" y="559" text-anchor="middle">sensores + cómputo y red + actuadores</text>
  <text class="p" x="175" y="576" text-anchor="middle">ciclo medir → decidir → actuar</text>

  <!-- ================= RAMA 2 ================= -->
  <rect class="head2" x="360" y="108" width="280" height="40" rx="10"/>
  <text class="hd t2" x="500" y="133" text-anchor="middle">2. EMPRESA Y ENTORNOS IT/OT</text>

  <line class="v2" x1="500" y1="148" x2="500" y2="170"/>
  <line class="v2" x1="500" y1="264" x2="500" y2="282"/>
  <line class="v2" x1="500" y1="376" x2="500" y2="394"/>
  <line class="v2" x1="500" y1="488" x2="500" y2="506"/>

  <rect class="card2" x="360" y="170" width="280" height="94" rx="12"/>
  <text class="bt t2" x="500" y="202" text-anchor="middle">Estructura de la empresa</text>
  <text class="p" x="500" y="223" text-anchor="middle">áreas y niveles de decisión;</text>
  <text class="p" x="500" y="240" text-anchor="middle">dónde encaja lo digital</text>

  <rect class="card2" x="360" y="282" width="280" height="94" rx="12"/>
  <text class="bt t2" x="500" y="314" text-anchor="middle">Entornos IT y OT</text>
  <text class="p" x="500" y="335" text-anchor="middle">negocio frente a planta;</text>
  <text class="p" x="500" y="352" text-anchor="middle">diferencias y similitudes</text>

  <rect class="card2" x="360" y="394" width="280" height="94" rx="12"/>
  <text class="bt t2" x="500" y="426" text-anchor="middle">Tecnologías de planta y negocio</text>
  <text class="p" x="500" y="447" text-anchor="middle">ERP, CRM, BI (IT)</text>
  <text class="p" x="500" y="464" text-anchor="middle">PLC, SCADA, MES (OT)</text>

  <rect class="card2" x="360" y="506" width="280" height="94" rx="12"/>
  <text class="bt t2" x="500" y="538" text-anchor="middle">Convergencia IT-OT</text>
  <text class="p" x="500" y="559" text-anchor="middle">la información fluye de extremo a extremo;</text>
  <text class="p" x="500" y="576" text-anchor="middle">ventajas y riesgos</text>

  <!-- ================= RAMA 3 ================= -->
  <rect class="head3" x="685" y="108" width="280" height="40" rx="10"/>
  <text class="hd t3" x="825" y="133" text-anchor="middle">3. ALCANCE E IMPLICACIONES</text>

  <line class="v3" x1="825" y1="148" x2="825" y2="170"/>
  <line class="v3" x1="825" y1="264" x2="825" y2="282"/>
  <line class="v3" x1="825" y1="376" x2="825" y2="394"/>

  <rect class="card3" x="685" y="170" width="280" height="94" rx="12"/>
  <text class="bt t3" x="825" y="202" text-anchor="middle">Sectores productivos</text>
  <text class="p" x="825" y="223" text-anchor="middle">industria, primario, comercio,</text>
  <text class="p" x="825" y="240" text-anchor="middle">sanidad, educación, AA. PP.</text>

  <rect class="card3" x="685" y="282" width="280" height="94" rx="12"/>
  <text class="bt t3" x="825" y="314" text-anchor="middle">Nuevos modelos de negocio</text>
  <text class="p" x="825" y="335" text-anchor="middle">plataformas, «as a Service»,</text>
  <text class="p" x="825" y="352" text-anchor="middle">servitización, D2C</text>

  <rect class="card3" x="685" y="394" width="280" height="94" rx="12"/>
  <text class="bt t3" x="825" y="426" text-anchor="middle">Retos y riesgos</text>
  <text class="p" x="825" y="447" text-anchor="middle">empleo, ciberseguridad,</text>
  <text class="p" x="825" y="464" text-anchor="middle">desinformación, regulación</text>

  <!-- ================= IDEA CLAVE ================= -->
  <rect class="ik" x="35" y="624" width="930" height="54" rx="10"/>
  <circle cx="66" cy="651" r="12" fill="#673ab7"/>
  <circle cx="66" cy="651" r="4.5" fill="#efe7fb"/>
  <text class="ikt" x="90" y="647" font-size="11.5px">IDEA CLAVE:</text>
  <text class="ikp" x="166" y="647">la digitalización transforma la manera en que vivimos, trabajamos y nos</text>
  <text class="ikp" x="90" y="665">relacionamos. Aporta oportunidades, pero también desafíos que exigen un uso responsable y seguro.</text>
</svg>
