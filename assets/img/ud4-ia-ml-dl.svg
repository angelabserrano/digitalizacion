<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" role="img" aria-labelledby="t d">
  <title id="t">Relación entre IA, machine learning y deep learning</title>
  <desc id="d">El deep learning es un subconjunto del machine learning, que a su vez es un subconjunto de la inteligencia artificial. La IA generativa se apoya en el deep learning.</desc>
  <style>
    .bg{fill:#fbf7f2;}
    text{font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;fill:#26221e;}
    .h{font-weight:700;font-size:16px;}
    .l1{font-weight:700;font-size:15px;fill:#7a3e00;}
    .l2{font-weight:700;font-size:15px;fill:#7a3e00;}
    .l3{font-weight:700;font-size:15px;fill:#7a3e00;}
    .gen{font-weight:700;font-size:13px;fill:#ffffff;}
    .p{font-size:12px;fill:#4a443d;}
  </style>
  <rect class="bg" x="0" y="0" width="760" height="430" rx="14"/>
  <text class="h" x="380" y="32" text-anchor="middle">Inteligencia artificial, machine learning y deep learning</text>

  <rect x="40" y="52" width="680" height="330" rx="20" fill="#fff3e6" stroke="#e8710a" stroke-width="2"/>
  <text class="l1" x="64" y="80">Inteligencia artificial (IA)</text>
  <text class="p" x="64" y="100">Sistemas que realizan tareas que requerir&#237;an inteligencia humana</text>

  <rect x="110" y="118" width="540" height="238" rx="18" fill="#ffe0bf" stroke="#e8710a" stroke-width="1.5"/>
  <text class="l2" x="134" y="146">Machine learning</text>
  <text class="p" x="134" y="166">Aprende patrones a partir de datos de ejemplo</text>

  <rect x="196" y="182" width="368" height="150" rx="16" fill="#ffcc99" stroke="#e8710a" stroke-width="1.5"/>
  <text class="l3" x="220" y="210">Deep learning</text>
  <text class="p" x="220" y="230">Redes neuronales con muchas capas</text>

  <rect x="256" y="256" width="248" height="52" rx="26" fill="#e8710a"/>
  <text class="gen" x="380" y="288" text-anchor="middle">IA generativa</text>
</svg>
