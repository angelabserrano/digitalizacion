<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 240" role="img" aria-labelledby="t d">
  <title id="t">Otras tecnolog&#237;as habilitadoras: RPA e impresi&#243;n 3D</title>
  <desc id="d">La automatización robótica de procesos (RPA) imita las acciones de una persona sobre aplicaciones informáticas; la impresión 3D o fabricación aditiva construye objetos añadiendo material capa a capa.</desc>
  <style>
    .bg{fill:#fbf7f2;}
    .card{fill:#ffffff;stroke:#e8710a;stroke-width:2;}
    text{font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;fill:#26221e;}
    .h{font-weight:700;font-size:17px;}
    .bt{font-weight:700;font-size:14.5px;}
    .p{font-size:11px;fill:#4a443d;}
    .icon{stroke:#e8710a;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round;}
    .iconFill{fill:#e8710a;stroke:none;}
  </style>
  <rect class="bg" x="0" y="0" width="880" height="240" rx="14"/>
  <text class="h" x="440" y="30" text-anchor="middle">Otras tecnolog&#237;as habilitadoras</text>

  <g>
    <rect class="card" x="24" y="54" width="400" height="166" rx="12"/>
    <g transform="translate(48,72)">
      <rect class="icon" x="1" y="1" width="26" height="20" rx="3"/>
      <circle class="iconFill" cx="8" cy="11" r="2"/><circle class="iconFill" cx="14" cy="11" r="2"/><circle class="iconFill" cx="20" cy="11" r="2"/>
      <path class="icon" d="M27 11 L34 11 L34 20 L30 20"/>
    </g>
    <text class="bt" x="92" y="92">RPA</text>
    <text class="p" x="48" y="130"><tspan font-style="italic">Robotic Process Automation</tspan>:</text>
    <text class="p" x="48" y="148">software que imita las acciones de</text>
    <text class="p" x="48" y="166">una persona sobre aplicaciones</text>
    <text class="p" x="48" y="184">informáticas, sin ningún robot físico</text>
  </g>

  <g>
    <rect class="card" x="456" y="54" width="400" height="166" rx="12"/>
    <g transform="translate(480,72)">
      <rect class="iconFill" x="1" y="20" width="26" height="5" rx="1.5" opacity="0.45"/>
      <rect class="iconFill" x="1" y="12" width="26" height="5" rx="1.5" opacity="0.7"/>
      <rect class="iconFill" x="1" y="4" width="26" height="5" rx="1.5"/>
    </g>
    <text class="bt" x="524" y="92">Impresión 3D</text>
    <text class="p" x="480" y="130">Fabricación aditiva: construye</text>
    <text class="p" x="480" y="148">el objeto añadiendo material</text>
    <text class="p" x="480" y="166">capa a capa, a partir de un</text>
    <text class="p" x="480" y="184">diseño digital</text>
  </g>
</svg>
